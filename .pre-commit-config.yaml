# Runs the checks CI runs, before the commit rather than after the push.
#
# Install once per clone:
#
#     pip install -e ".[hooks]" && pre-commit install
#
# Run it over everything without committing:
#
#     pre-commit run --all-files
#
# Every version here is pinned to the one pyproject.toml's `dev` extra installs. A hook
# on a different version is worse than no hook at all: it either reformats code CI then
# rejects, or accepts code CI rejects, and from inside either side the disagreement is
# invisible. Bumping one means bumping the other in the same commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with `ruff==0.16.1` in pyproject.toml.
    rev: v0.16.1
    hooks:
      # Deliberately without `--fix`. A lint autofix rewrites code to satisfy a rule,
      # which is not always the change the author would have made, and CI runs
      # `ruff check` without it — a lint error is worth reading rather than silently
      # applying.
      - id: ruff-check
      # This one does rewrite, on purpose: formatting is semantics-preserving, so a
      # hook that fixes the file beats one that tells you to go and run the formatter.
      # pre-commit fails any run in which a hook modified a file, so the rewrite still
      # has to be staged and committed deliberately.
      #
      # Both hooks match `jupyter` as well as `python`, which is what keeps the code
      # cells of examples/mnist.ipynb formatted alongside everything else.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Neither of these is cosmetic. Trailing whitespace and a missing final newline
      # produce diff noise in the *next* commit to touch the file, attributed to
      # whoever made that change rather than to whoever left the whitespace.
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      # mypy runs from this project's environment rather than from
      # pre-commit/mirrors-mypy, which would install it into an isolated virtualenv of
      # its own. Two things break there.
      #
      # First, mypy's findings here depend on the NumPy stubs it can see — pyproject
      # leaves `python_version` unset for exactly that reason — and that isolated
      # environment has no NumPy at all unless one is pinned into
      # `additional_dependencies`, which is a numpy version this repository
      # deliberately does not pin anywhere else.
      #
      # Second, the mirror passes filenames, which overrides `files = ["pynn"]` in
      # pyproject and type-checks whatever happened to be staged.
      #
      # `language: system` with no filenames runs the mypy on PATH — pinned by the dev
      # extra to the version CI installs — against the project's own configuration and
      # its own NumPy. That is the CI command exactly. It needs the virtualenv
      # activated; without it the hook fails loudly with `Executable `mypy` not found`
      # rather than checking nothing.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
