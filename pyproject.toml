[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynn"
version = "0.1.0"
description = "A NumPy-based neural network library with automatic differentiation and a PyTorch-like API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
numba = ["numba>=0.57"]
examples = [
    "scikit-learn>=1.0",
]
mnist = [
    "scikit-learn>=1.0",
    "pandas>=1.0",
]
dev = [
    "pytest>=7.0",
]
test = [
    "pytest>=7.0",
    "torch>=2.0",
    "tensorflow>=2.12",
]
all = [
    "numba>=0.57",
    "scikit-learn>=1.0",
    "pandas>=1.0",
    "pytest>=7.0",
    "torch>=2.0",
    "tensorflow>=2.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pynn*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "external: requires an optional third-party framework (torch, tensorflow)",
    "slow: takes more than a second or two to run",
]
