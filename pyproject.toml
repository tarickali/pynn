[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynn"
version = "0.1.0"
description = "A NumPy-based neural network library with automatic differentiation and a PyTorch-like API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

# The single source of truth for what each part of the repository needs. The three
# requirements*.txt files at the root point at these, so versions are pinned in exactly
# one place. See USAGE.md for which group covers what.
#
# Nothing is needed beyond NumPy to import the library or to run `python -m pynn.verify`.
# That is deliberate: the verification suite has to run wherever the library runs.
[project.optional-dependencies]
# Tests, lint, and type checking — what CI installs.
#
# ruff and mypy are pinned exactly; everything else in this file is a floor. Those two
# are the only dependencies whose *output* is the check: a newer `ruff format`
# reformats code that is clean today, and a newer mypy reports errors the current one
# does not. With a floor, CI installs whatever was released that morning, so the build
# goes red on a day nobody touched the repository and the diff explains nothing.
#
# The trade is that upgrading is now a deliberate edit rather than something that
# happens on its own. That is the point — `scripts/ci_matrix.sh` says whether the new
# version is green across all five interpreters before the pin moves, and
# `.pre-commit-config.yaml` pins its hook revisions to the same two versions so a local
# commit and a CI run cannot disagree.
#
# pytest stays a floor: a version that breaks something fails loudly, names the test,
# and does not silently rewrite the tree.
#
# numpy is deliberately *not* pinned anywhere. It is a runtime dependency, and the CI
# matrix tests against whichever version each interpreter supports on purpose.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
]
# examples/regression.py and examples/binary_classification.py.
examples = [
    "scikit-learn>=1.0",
]
# examples/mnist.py and scripts/download_mnist.py.
mnist = [
    "scikit-learn>=1.0",
    "pandas>=1.0",
]
# examples/mnist.ipynb: rendering it, and re-executing it headlessly.
notebook = [
    "matplotlib>=3.7",
    "pandas>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "nbclient>=0.8",
]
# benchmarks/benchmark.py. PyTorch only; it is the comparison target.
benchmark = [
    "torch>=2.0",
]
# The tests marked `external`, which compare against another framework.
#
# Kept out of `all` on purpose: TensorFlow lags new Python releases by months and has
# no wheel for 3.14 today, so folding it into `all` would make the one-command install
# fail on the interpreter this project is developed on. Those tests skip themselves
# when the frameworks are absent.
external = [
    "torch>=2.0",
    "tensorflow>=2.12",
]
# Compiles the scatter in the reverse pass of conv2d and the pooling layers, which is
# around 40% of a CNN training step and the only Python-level loop left in the library.
# Worth ~1.27x end-to-end on a small CNN, nothing on an MLP. Optional because llvmlite
# is 130 MB and the library is fully functional without it.
numba = [
    "numba>=0.57",
]
# Everything needed to run every part of the repository, on any supported Python.
all = [
    "pynn[dev,examples,mnist,notebook,benchmark]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pynn*"]

[tool.ruff]
# Pinned explicitly: ruff's default rule set varies between releases, so relying on it
# makes `ruff check` results depend on which version happens to be installed.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "NPY",  # numpy-specific
    "RUF",  # ruff-specific
]
ignore = [
    # X, W, B, K, O for matrices and tensors is the convention this domain reads in,
    # and matches the notation in the docstrings.
    "E741",
]

[tool.mypy]
# No `python_version` on purpose: it would pin the *analysis* target while the stubs
# on disk belong to whatever NumPy the running interpreter installed. Pinning 3.10
# against a modern numpy is a hard failure — its `__init__.pyi` uses PEP 695 `type`
# statements, which mypy refuses to parse when told to assume 3.10, and it aborts
# before checking anything (exit 2).
#
# Leaving it unset means each CI job checks against its own interpreter, which covers
# 3.10 through 3.14 across the matrix rather than checking 3.10 five times.
files = ["pynn"]
# Off because the CI matrix type-checks against five interpreters, each with the NumPy
# that supports it. An ignore that a given stub version genuinely needs is unused
# against the others, so leaving this on turns "works everywhere" into an error.
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# numba is an optional extra and ships no stubs.
[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "external: requires an optional third-party framework (torch, tensorflow)",
    "slow: takes more than a second or two to run",
]

[tool.coverage.run]
source = ["pynn"]
# Record paths relative to the repository root. Without this the report names an
# absolute path from whichever machine produced it, which Codecov then has to guess
# how to map back onto the repository.
relative_files = true

[tool.coverage.report]
# The threshold lives here rather than in pytest's addopts so that running a single
# test file does not fail for covering only one module. Any run that opts into
# measurement — `pytest --cov=pynn`, which is what CI does — is held to it.
fail_under = 95
show_missing = true
exclude_also = [
    # Abstract method bodies. Reaching them means a subclass failed to override, which
    # is what the ABC already prevents.
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
