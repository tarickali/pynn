[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynn"
version = "0.1.0"
description = "A NumPy-based neural network library with automatic differentiation and a PyTorch-like API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
numba = ["numba>=0.57"]
examples = [
    "scikit-learn>=1.0",
]
mnist = [
    "scikit-learn>=1.0",
    "pandas>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
test = [
    "pytest>=7.0",
    "torch>=2.0",
    "tensorflow>=2.12",
]
all = [
    "numba>=0.57",
    "scikit-learn>=1.0",
    "pandas>=1.0",
    "pytest>=7.0",
    "torch>=2.0",
    "tensorflow>=2.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pynn*"]

[tool.ruff]
# Pinned explicitly: ruff's default rule set varies between releases, so relying on it
# makes `ruff check` results depend on which version happens to be installed.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "NPY",  # numpy-specific
    "RUF",  # ruff-specific
]
ignore = [
    # X, W, B, K, O for matrices and tensors is the convention this domain reads in,
    # and matches the notation in the docstrings.
    "E741",
]

[tool.mypy]
python_version = "3.10"
files = ["pynn"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# numba is an optional extra and ships no stubs.
[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "external: requires an optional third-party framework (torch, tensorflow)",
    "slow: takes more than a second or two to run",
]

[tool.coverage.run]
source = ["pynn"]

[tool.coverage.report]
# The threshold lives here rather than in pytest's addopts so that running a single
# test file does not fail for covering only one module. Any run that opts into
# measurement — `pytest --cov=pynn`, which is what CI does — is held to it.
fail_under = 95
show_missing = true
exclude_also = [
    # Abstract method bodies. Reaching them means a subclass failed to override, which
    # is what the ABC already prevents.
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
