name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check pynn tests examples scripts
          ruff format --check pynn tests examples scripts

      - name: Mypy
        run: mypy

      - name: Pytest
        # The optional torch/tensorflow comparison tests skip themselves when those
        # packages are absent; exclude them explicitly so CI stays NumPy-only.
        run: pytest -m "not external"

      - name: Verify
        run: python -m pynn.verify
