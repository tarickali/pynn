name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is here because it is what the project is developed on locally; without
        # it a 3.14-only regression would only ever surface on a developer's machine.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # These majors are the first that run on Node 24. GitHub deprecated the Node 20
      # runtime in September 2025 and now forces those actions onto Node 24 anyway,
      # with a warning on every job; the earlier majors are living on borrowed time.
      # Newer majors exist (checkout v7, setup-python v7) — moving up is a separate
      # decision from silencing the deprecation.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check pynn tests examples scripts benchmarks
          ruff format --check pynn tests examples scripts benchmarks

      - name: Mypy
        run: mypy

      - name: Pytest
        # The optional torch/tensorflow comparison tests skip themselves when those
        # packages are absent; exclude them explicitly so CI stays NumPy-only.
        # --cov opts into the fail_under threshold configured in pyproject.toml.
        run: pytest -m "not external" --cov=pynn --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        # Immediately after pytest, and not gated on the run being green: a failing
        # test is exactly when the coverage delta is worth looking at, and a step
        # placed after `Verify` would be skipped whenever anything upstream failed.
        # One version only, since every job produces the same report.
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        # v6 is where Node 24 support landed. v5 bundles a Node 20 build of
        # actions/github-script, which is why only the job that uploads coverage
        # reported a third deprecated action.
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Verify
        run: python -m pynn.verify
