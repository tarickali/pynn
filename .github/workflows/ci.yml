name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is here because it is what the project is developed on locally; without
        # it a 3.14-only regression would only ever surface on a developer's machine.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check pynn tests examples scripts benchmarks
          ruff format --check pynn tests examples scripts benchmarks

      - name: Mypy
        run: mypy

      - name: Pytest
        # The optional torch/tensorflow comparison tests skip themselves when those
        # packages are absent; exclude them explicitly so CI stays NumPy-only.
        # --cov opts into the fail_under threshold configured in pyproject.toml.
        run: pytest -m "not external" --cov=pynn --cov-report=xml --cov-report=term-missing

      - name: Verify
        run: python -m pynn.verify

      - name: Upload coverage
        # One version only: every job produces the same report, and uploading all four
        # just makes Codecov wait for reports it does not need.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
